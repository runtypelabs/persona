packages:
  - packages/*
  - apps/*
  - examples/*
verifyDepsBeforeRun: false
enableGlobalVirtualStore: true
allowBuilds:
  "@google/genai": false
  core-js-pure: false
  protobufjs: false
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - "@tsrs/darwin-arm64@0.22.0-ts7.1.0-beta"
  - "@tsrs/darwin-x64@0.22.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-gnu@0.22.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-musl@0.22.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-gnu@0.22.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-musl@0.22.0-ts7.1.0-beta"
  - "@tsrs/win32-x64@0.22.0-ts7.1.0-beta"
  - tsrs@0.22.0-ts7.1.0-beta
  - playwright-core@1.65.0
  - rolldown-plugin-dts@0.30.0
  - tsdown@0.23.7
  - "@ui-sdk/core@0.1.0-beta.1"
  - "@ui-sdk/web@0.1.0-beta.1"
overrides:
  "alasql>react-native-fs": "-"
