<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico">
  <title>Minimal embed · Persona</title>
  <style>
    body { margin: 0; padding: 3rem 1.5rem; background: #f8fafc; color: #172033; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 800px; margin: auto; }
    h1 { margin-bottom: .5rem; }
    p { color: #475569; }
    pre { padding: 1.5rem; overflow: auto; border-radius: 12px; background: #172033; color: #f8fafc; font-size: 14px; }
    button { padding: .65rem 1rem; border: 1px solid #cbd5e1; border-radius: 8px; background: white; color: #172033; font: inherit; cursor: pointer; }
    a { color: #1d4ed8; }
  </style>
</head>
<body>
  <main>
    <h1>Minimal embed</h1>
    <p>One configuration and one installer script. Open the launcher to try it.</p>
    <h2>Add it to your page</h2>
    <p>Point <code>apiUrl</code> at your Persona-compatible backend. The live example uses the showcase proxy.</p>
    <button id="copy-embed" type="button">Copy embed</button>
    <span id="copy-status" role="status"></span>
    <pre><code id="embed-snippet"></code></pre>
    <p>For page context, actions, persistence, and voice input, see <a href="/standalone/example-shop.html">Shopping integration</a>.</p>
  </main>
  <script id="minimal-config">
    const minimalConfig = {
      apiUrl: '/api/chat/dispatch',
      persistState: false,
      launcher: { enabled: true, title: 'Ask us', subtitle: 'How can we help?' },
      welcome: { title: 'Hello!', subtitle: 'What would you like to know?', variant: 'card' }
    };
    // This is the complete embed. The local asset overrides below are only for this showcase.
    const snippet = '<script>\nwindow.siteAgentConfig = ' + JSON.stringify({ config: minimalConfig }, null, 2) + ';\n<\/script>\n' +
      '<script src="https://cdn.jsdelivr.net/npm/@runtypelabs/persona@4/dist/install.global.js"><\/script>';
    document.getElementById('embed-snippet').textContent = snippet;
    document.getElementById('copy-embed').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(snippet);
        document.getElementById('copy-status').textContent = 'Copied';
      } catch {
        document.getElementById('copy-status').textContent = 'Select and copy the code below.';
      }
    });
    const isLocal = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
    const assetBase = isLocal ? '/widget-dist' : 'https://cdn.jsdelivr.net/npm/@runtypelabs/persona@4/dist';
    window.siteAgentConfig = {
      version: '4',
      cssUrl: assetBase + '/widget.css',
      jsUrl: assetBase + '/index.global.js',
      config: { ...minimalConfig, apiUrl: isLocal ? minimalConfig.apiUrl : 'https://proxy.persona-chat.dev/api/chat/dispatch' }
    };
    const script = document.createElement('script');
    script.src = assetBase + '/install.global.js';
    document.head.appendChild(script);
  </script>
  <script type="module">
    import { renderStandaloneNav } from '/src/standalone-nav.ts';
    renderStandaloneNav('sample');
  </script>
</body>
</html>
