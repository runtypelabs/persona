<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1920" />
  <title>Persona v5 preview promo</title>
</head>
<body>
  <div id="stage">
    <div id="bg"><div id="floor"></div><div id="glow"></div></div>

    <section id="intro" class="layer center">
      <div class="intro-lockup">
        <div class="logo-wrap" id="intro-logo"></div>
        <div class="pill" id="intro-pill"><span class="pill-dot"></span>V5 PREVIEW</div>
      </div>
    </section>

    <section id="s2" class="layer scene3d">
      <div class="cam" id="cam2">
        <div class="code-card" id="code"></div>
        <div class="device" id="device">
          <div class="wstack" id="wstack"></div>
          <div class="scanline" id="scanline"></div>
        </div>
      </div>
    </section>

    <section id="s3" class="layer scene3d">
      <div class="cam" id="cam3"></div>
    </section>

    <section id="outro" class="layer center">
      <div class="outro-lockup">
        <div class="logo-wrap" id="outro-logo"></div>
        <div class="outro-row" id="outro-row">
          <div class="pill"><span class="pill-dot"></span>V5 PREVIEW</div>
          <code class="outro-code">future: { v5Defaults: <b>true</b> }</code>
        </div>
        <div class="outro-url" id="outro-url">persona-chat.dev/v5-preview.html</div>
      </div>
      <div class="built-by" id="built-by"><span>built by</span><span class="runtype-wordmark">runtype</span></div>
    </section>

    <div id="hud">
      <div class="hud-block" id="hud2">
        <div class="kicker"><span class="kicker-num">01</span>NEW DEFAULTS</div>
        <h1>Fresh defaults.<br />Your brand in six fields.</h1>
      </div>
      <div class="hud-block" id="hud3">
        <div class="kicker"><span class="kicker-num">02</span>ANY CHAT STYLE</div>
        <h1>Every assistant look. Just config.</h1>
      </div>
    </div>
    <div id="vignette"></div>
  </div>
  <script type="module" src="/main.ts"></script>
</body>
</html>
