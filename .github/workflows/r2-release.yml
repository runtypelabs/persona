name: Publish to R2 CDN

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. @runtypelabs/persona@4.32.1)'
        required: true
        type: string

concurrency:
  group: r2-release
  cancel-in-progress: false

jobs:
  publish-to-r2:
    name: Publish to R2 CDN
    if: startsWith(inputs.tag, '@runtypelabs/persona@')
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: ${{ vars.R2_BUCKET || 'cdn-assets' }}
      CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: "24"

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { validateVersion } from './scripts/cdn/publish.mjs';
          const version = validateVersion(process.env.RELEASE_TAG.replace(/^@runtypelabs\/persona@/, ''));
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          JS

      - name: Check if should update latest
        id: check-latest
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          CURRENT="$RELEASE_VERSION"
          CURRENT_NO_BUILD="${CURRENT%%+*}"

          # Pre-releases should never update latest.
          if [[ "$CURRENT_NO_BUILD" == *-* ]]; then
            echo "Skipping latest update: pre-release version $CURRENT"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Get the highest stable version from existing git tags
          HIGHEST=$(git tag -l '@runtypelabs/persona@*' | \
            sed 's/@runtypelabs\/persona@//' | \
            grep -v '-' | \
            sort -V | \
            tail -1)

          echo "Current version: $CURRENT"
          echo "Highest stable version: $HIGHEST"

          # Update latest only if current >= highest
          if [[ -z "$HIGHEST" ]] || [[ "$(printf '%s\n' "$HIGHEST" "$CURRENT" | sort -V | tail -1)" == "$CURRENT" ]]; then
            echo "Will update latest"
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping latest update: $CURRENT is older than $HIGHEST"
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check publishing credentials
        if: steps.check-latest.outputs.should_update == 'true'
        run: |
          test -n "$CLOUDFLARE_ZONE_ID" || { echo "Set the CLOUDFLARE_ZONE_ID repository variable"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Set the CLOUDFLARE_API_TOKEN repository secret with Cache Purge permission"; exit 1; }

      # Use the exact npm artifact, never a second build of a moving branch.
      # npm publish-time scanning can delay availability by several minutes.
      # Wait up to ten minutes without rebuilding or promoting missing assets.
      - name: Download published widget
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p cdn-package cdn-dist
          for attempt in {1..31}; do
            if npm pack "@runtypelabs/persona@$RELEASE_VERSION" --ignore-scripts --prefer-online --registry=https://registry.npmjs.org --pack-destination cdn-package; then
              break
            fi
            if [ "$attempt" = 31 ]; then
              echo "Published package is still unavailable after ten minutes; leaving the CDN unchanged. Once npm serves the release, use Re-run failed jobs or manually dispatch Publish to R2 CDN with tag @runtypelabs/persona@$RELEASE_VERSION."
              exit 1
            fi
            echo "Waiting for npm release availability (attempt $attempt/31)."
            sleep 20
          done
          tar -xzf cdn-package/*.tgz -C cdn-dist --strip-components=2 package/dist

      - name: Publish and verify CDN assets
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SHOULD_UPDATE_LATEST: ${{ steps.check-latest.outputs.should_update }}
        run: |
          aws --version
          if [ "$SHOULD_UPDATE_LATEST" = true ]; then
            node scripts/cdn/publish.mjs cdn-dist "$RELEASE_VERSION" --latest
          else
            node scripts/cdn/publish.mjs cdn-dist "$RELEASE_VERSION"
          fi

      - name: Summary
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          SHOULD_UPDATE_LATEST: ${{ steps.check-latest.outputs.should_update }}
        run: |
          echo "## R2 CDN Upload Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`$RELEASE_VERSION\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Bucket:** \`$R2_BUCKET\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### Uploaded Paths" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`persona/$RELEASE_VERSION/\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SHOULD_UPDATE_LATEST" == "true" ]]; then
            echo "- \`persona/latest/\` ✓" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- \`persona/latest/\` _(skipped)_" >> "$GITHUB_STEP_SUMMARY"
          fi
