name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}
      widgetVersion: ${{ steps.widget-version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.1
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm changeset version
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read published widget version
        id: widget-version
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const packages = JSON.parse(process.env.PUBLISHED_PACKAGES || '[]');
          const widget = packages.find(pkg => pkg.name === '@runtypelabs/persona');
          if (widget) appendFileSync(process.env.GITHUB_OUTPUT, `version=${widget.version}\n`);
          JS

  publish-to-r2:
    name: Publish to R2 CDN
    needs: release
    if: >-
      needs.release.outputs.published == 'true' &&
      needs.release.outputs.widgetVersion != ''
    uses: ./.github/workflows/r2-release.yml
    with:
      tag: '@runtypelabs/persona@${{ needs.release.outputs.widgetVersion }}'
    secrets: inherit
